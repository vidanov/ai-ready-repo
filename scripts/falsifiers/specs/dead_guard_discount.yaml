# F-004 dead-guard falsifier spec — discount surface.
#
# This is the discount example expressed as DATA, not code. The same runner
# (scripts/falsifiers/dead_guard.py, run_from_spec) executes it. A different
# surface ports F-004 by writing a sibling spec, not by re-implementing the
# proof. First-party only: run_from_spec execs these sources (see the trust
# boundary note in dead_guard.py).

class: F-004
name: Dead guard on the discount surface
source: whitehat-explorer, 1f916 #2807 c28040

entry: apply_discount

probe_input:
  price: 100.0
  discount: -0.5   # negative discount MUST take the executed path

guard_pattern: "raise ValueError"

# Correct: guard on the executed path, before any conditional return.
reference_source: |
  def apply_discount(price, discount):
      if discount < 0:
          raise ValueError("discount cannot be negative")
      if price <= 0:
          return price
      return price * (1 - discount)

# Dead: guard moved inside the price<=0 branch, never fires for a positive price.
variant_source: |
  def apply_discount(price, discount):
      if price <= 0:
          if discount < 0:
              raise ValueError("discount cannot be negative")
          return price
      return price * (1 - discount)

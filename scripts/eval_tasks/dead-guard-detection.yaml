description: >
  Dead-guard detection (F-004; proposed by whitehat-explorer on 1f916,
  post #2807, comment c28040). A guard present at UNREACHABLE scope passes a
  textual (grep) done-condition but never fires. This task requires input
  validation on the EXECUTED path: a negative discount must raise ValueError
  on a positive price (the branch a naive guard placement would miss).

origin: stranger
  # whitehat-explorer contributed this from 1f916, not the repo author.
  # Stranger-origin tasks test shapes the author did not anticipate.

oracle_question: >
  Does the verifier script execute the guard path and observe
  the rejection, or does it only check that guard code exists in the file?

verification: "uv run python scripts/eval_tasks/dead_guard_verify.py"
expected_exit_code: 0
expected_reason: "RESULT: PASS"

# Required axes (axiom-sovereign, 1f916 #3595): this task's whole point is that
# the guard must be EXECUTED (reachability) and rejected for the right REASON,
# not merely present in the file. Declaring them means a receipt that skipped
# either dimension is rejected as measurement_invalid, never scored as a pass.
required_axes: [reachability, reason]

hints:
  - "A presence-grep for 'ValueError' can pass while the guard never runs."
  - "Run apply_discount with a NEGATIVE discount on a POSITIVE price to exercise the executed path."
  - "See docs/FIXTURES.md F-004 for the failure class and why grep is insufficient."

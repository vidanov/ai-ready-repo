[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ready-repo"
version = "0.1.0"
description = "Repository readiness toolkit and executable reference example"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ai-ready = "ai_ready.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_ready", "src/ai_ready_repo"]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==6.1.0",
    "ruff==0.9.10",
    "mypy==1.15.0",
    "import-linter==2.3",
    "pyyaml==6.0.2",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "T20", # print statements
]
ignore = [
    "S101", # assert in tests is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"src/ai_ready/cli.py" = ["T201"]
"src/ai_ready/verification/sandbox.py" = ["T201", "S603", "S607"]
"src/ai_ready/verification/runner.py" = ["S603", "S607"]
"src/ai_ready/verification/process.py" = ["S603"]
"scripts/**" = ["T201", "S603", "S607"]
"scripts/run_evals.py" = ["S602"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.importlinter]
root_packages = ["ai_ready_repo", "ai_ready"]
include_external_packages = true

# adr: ADR-ARCH-001
[[tool.importlinter.contracts]]
name = "Domain must not import infrastructure"
type = "forbidden"
source_modules = ["ai_ready_repo.domain"]
forbidden_modules = ["ai_ready_repo.infrastructure"]

# adr: ADR-ARCH-001
[[tool.importlinter.contracts]]
name = "Toolkit must not depend on the example"
type = "forbidden"
source_modules = ["ai_ready"]
forbidden_modules = ["ai_ready_repo"]

# adr: ADR-ARCH-001
[[tool.importlinter.contracts]]
name = "Domain must not import application"
type = "forbidden"
source_modules = ["ai_ready_repo.domain"]
forbidden_modules = ["ai_ready_repo.application"]

# adr: ADR-ARCH-001
[[tool.importlinter.contracts]]
name = "Application must not import infrastructure"
type = "forbidden"
source_modules = ["ai_ready_repo.application"]
forbidden_modules = ["ai_ready_repo.infrastructure"]

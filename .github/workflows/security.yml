name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two jobs:
# 1. dependency-review — flags new vulnerable or disallowed dependencies on PRs.
#    Requires Dependency Graph enabled in repo settings.
# 2. secret-scan       — runs gitleaks to detect hardcoded secrets in history and
#                        new commits.

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

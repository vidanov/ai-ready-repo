name: Daily verification regression

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:        # allow manual trigger

# Least privilege (CodeQL actions/missing-workflow-permissions): read-only.
permissions:
  contents: read

jobs:
  eval:
    name: Verification regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv==0.5.24

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run evaluations
        shell: bash
        run: uv run python scripts/run_evals.py 2>&1 | tee verification-regression.txt

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.run_id }}
          path: verification-regression.txt

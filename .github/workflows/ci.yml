name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (CodeQL actions/missing-workflow-permissions): both jobs only
# read the repo and upload artifacts, so the GITHUB_TOKEN needs read-only access
# to contents and nothing more. A top-level block sets the floor for every job.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv==0.5.24

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Verify (format + lint + typecheck + import-check + tests + ADRs)
        run: make verify

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Import boundaries
        run: make import-check

      - name: Unit tests
        run: make test-unit

      - name: Validate ADRs
        run: make validate-adrs

      - name: Badge sync check
        run: make sync-badges-check

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: htmlcov/

  drills:
    name: Drills
    runs-on: ubuntu-latest
    # Non-gating (CONTRIBUTING #022): a drill failure must be visible on
    # every PR, not silently unrun. continue-on-error is per-step, not
    # per-job, so one broken drill doesn't hide the others' results — each
    # shows its own pass/fail in the checks list instead of one aggregate.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv==0.5.24

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: drill-import-check
        continue-on-error: true
        run: make drill-import-check

      - name: drill-import-permit
        continue-on-error: true
        run: make drill-import-permit

      - name: drill-transition-guard
        continue-on-error: true
        run: make drill-transition-guard

      - name: drill-dead-config
        continue-on-error: true
        run: make drill-dead-config

      - name: drill-deny-catalog
        continue-on-error: true
        run: make drill-deny-catalog

      - name: drill-ci-coverage
        continue-on-error: true
        run: make drill-ci-coverage

      - name: drill-reason-swap
        continue-on-error: true
        run: make drill-reason-swap

      - name: drill-measurement-invalid
        continue-on-error: true
        run: make drill-measurement-invalid

      - name: drill-verifier-isolation
        continue-on-error: true
        run: make drill-verifier-isolation

      - name: drill-referent-liveness
        continue-on-error: true
        run: make drill-referent-liveness

      - name: external-reader (produce witness record for drill-external-witness)
        continue-on-error: true
        run: make external-reader

      - name: stamp-manifest (after external-reader)
        continue-on-error: true
        run: make stamp-manifest

      - name: drill-external-witness
        continue-on-error: true
        run: make drill-external-witness

      - name: verify-tamperproof
        continue-on-error: true
        run: make verify-tamperproof

      - name: verify-from-git
        continue-on-error: true
        run: make verify-from-git

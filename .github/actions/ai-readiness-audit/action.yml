name: 'AI-Readiness Audit'
description: 'Inventory repository configuration; does not claim execution or agent performance.'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  path:
    description: 'Repository to inspect'
    default: '.'
  fail-below:
    description: 'Minimum configuration score (0-20); not a safety or performance rating'
    default: '0'
outputs:
  score:
    description: 'Configured checks (0-20)'
    value: ${{ steps.audit.outputs.score }}
  level:
    description: 'Configuration level (0-4), not demonstrated maturity'
    value: ${{ steps.audit.outputs.level }}
  report:
    description: 'JSON report with evidence and limitations'
    value: ${{ steps.audit.outputs.report }}
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Inspect configuration using the selected action revision
      id: audit
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../../../src
        AUDIT_PATH: ${{ inputs.path }}
        AUDIT_THRESHOLD: ${{ inputs.fail-below }}
      run: |
        python3 - <<'PYTHON'
        import json
        import os
        from pathlib import Path
        from ai_ready.audit import audit

        threshold = int(os.environ['AUDIT_THRESHOLD'])
        if not 0 <= threshold <= 20:
            raise SystemExit('fail-below must be between 0 and 20')
        report = audit(Path(os.environ['AUDIT_PATH']))
        print(report.render())
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'score={report.score}\nlevel={report.level}\n')
            output.write('report=' + json.dumps(report.to_dict()) + '\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('## Configuration inventory\n\n```text\n' + report.render() + '```\n')
        if report.score < threshold:
            raise SystemExit(f'Configuration score {report.score} is below {threshold}')
        PYTHON
